name: job-management-dashboard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobs}
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Everything downstream gates on this. Without it the stack starts before
      # Postgres finishes initializing and the suite fails intermittently —
      # TEST_PLAN case A2.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobs} -d ${POSTGRES_DB:-jobs}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobs}
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,[::1]}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposed for debugging only — the app itself reaches the API through
      # nginx on :8080, never directly.
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).status==200 else 1)\""]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  e2e:
    build:
      context: ./e2e
    profiles: ["test"]  # never started by `make up`; run on demand
    environment:
      E2E_BASE_URL: http://frontend
      CI: ${CI:-1}
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      # Specs are mounted, not just baked in at build time, so adding or
      # editing one does not require rebuilding the image — that is what keeps
      # `make test-spec` a seconds-long check (TEST_PLAN tier T1). The image
      # still contains them, so the mount only ever shadows identical content.
      - ./e2e/tests:/e2e/tests
      # Reports land on the host so failures are inspectable after the
      # container exits.
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results

volumes:
  pgdata:
